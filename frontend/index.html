<!DOCTYPE html>
<html>
<head>
    <title>Item Manager CRUD API</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            padding:50px;
        }

        .container{
            background:white;
            width:600px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#333;
        }

        p{
            color:#666;
        }

        .btn{
            display:inline-block;
            margin:10px;
            padding:12px 20px;
            text-decoration:none;
            color:white;
            border-radius:5px;
            font-weight:bold;
        }

        .create{
            background:#28a745;
        }

        .read{
            background:#007bff;
        }

        .update{
            background:#ffc107;
            color:black;
        }

        .delete{
            background:#dc3545;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Item Manager</h1>

    <p>PHP CRUD API Final Exam Project</p>

    <a class="btn create"
    href="../api/items/create.php?name=Phone&description=Android%20Phone&price=10000">
    Create Item
    </a>

    <a class="btn read"
    href="../api/items/read.php">
    View Items
    </a>

    <a class="btn update"
    href="../api/items/update.php?id=1&name=Phone%20Updated&description=Android%20Updated&price=12000">
    Update Item
    </a>

    <a class="btn delete"
    href="../api/items/delete.php?id=2">
    Delete Item
    </a>

</div>

</body>
</html>
